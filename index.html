<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#3F5B3A"><link rel="manifest" href="manifest.webmanifest"><link rel="icon" type="image/png" href="icon-180.png"><link rel="apple-touch-icon" href="icon-180.png"><meta name="apple-mobile-web-app-capable" content="yes"><meta name="apple-mobile-web-app-title" content="Caminho da Fé"><meta name="color-scheme" content="light dark">
<title>Meu Caminho da Fé</title>
<style>
:root{--warnbg:#FBE4D4;--note:#FFF6DD;--noteb:#E8D28A;--notet:#5a4a10;--line2:#eee3cf;--kbg:#E8E8E8;color-scheme:light;--moss:#3F5B3A;--moss-d:#2C4129;--moss-l:#DDE6D3;--sand:#EFE8D8;--paper:#FBF8F1;--card:#fff;--clay:#A5603A;--ink:#26301F;--mute:#6B6A58;--line:#DDD3BC;--warn:#B3541E;--ok:#2F7A3E;--arrow:#F2C230;--r:14px}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
:root[data-theme=dark]{--paper:#161a14;--card:#1f261c;--ink:#e9e6da;--mute:#a9ab97;--line:#3a4434;--line2:#2c3527;--sand:#2b3326;--moss-l:#2d3c29;--moss:#4f7348;--moss-d:#c5dbb2;--clay:#d98e62;--warn:#ff9a63;--ok:#7fd08c;--warnbg:#4a2a19;--note:#3a3316;--noteb:#6b5c20;--notet:#efe0a6;--kbg:#2f372b;color-scheme:dark}
@media(prefers-color-scheme:dark){:root:not([data-theme=light]){--paper:#161a14;--card:#1f261c;--ink:#e9e6da;--mute:#a9ab97;--line:#3a4434;--line2:#2c3527;--sand:#2b3326;--moss-l:#2d3c29;--moss:#4f7348;--moss-d:#c5dbb2;--clay:#d98e62;--warn:#ff9a63;--ok:#7fd08c;--warnbg:#4a2a19;--note:#3a3316;--noteb:#6b5c20;--notet:#efe0a6;--kbg:#2f372b;color-scheme:dark}}
html{font-size:16px;-webkit-text-size-adjust:100%;max-width:100%}html.big{font-size:19px}
body{margin:0;background:var(--paper);color:var(--ink);font-family:system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;line-height:1.4;padding-bottom:calc(74px + env(safe-area-inset-bottom))}
header.top button.thm{margin-left:auto;background:rgba(255,255,255,.15);border:0;border-radius:10px;color:#fff;min-width:42px;min-height:42px;cursor:pointer}header.top button.thm svg{width:22px;height:22px;stroke:#fff;fill:none;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
button.card.ramal{display:block;width:100%;text-align:left;cursor:pointer;color:var(--ink);font:inherit;margin-bottom:10px}button.card.ramal b{display:block;color:var(--moss-d)}button.card.ramal:active{background:var(--sand)}
svg.mapa{width:100%;height:auto;display:block}svg.mapa .cn{stroke:var(--ink);stroke-opacity:.3;stroke-linejoin:round;stroke-linecap:round}svg.mapa .cn.mj{stroke-opacity:.5}:root[data-theme=dark] svg.mapa .terreno{opacity:.18}@media(prefers-color-scheme:dark){:root:not([data-theme=light]) svg.mapa .terreno{opacity:.18}}
svg.mapa text{font:600 10px system-ui,sans-serif;fill:var(--ink)}svg.mapa .mu{fill:var(--mute);font-weight:500}
#mapsvgbox{touch-action:none;cursor:grab;border-radius:12px;overflow:hidden;background:var(--sand)}#mapsvgbox:active{cursor:grabbing}.mapbox{position:relative}.mapctl{display:flex;flex-wrap:wrap;gap:6px;margin-top:6px}.mapctl button{min-width:48px;min-height:40px;border-radius:10px;border:1.5px solid var(--moss-d);background:var(--card);color:var(--moss-d);font:600 .82rem system-ui,sans-serif;cursor:pointer;padding:0 11px}
.seg{display:flex;background:var(--sand);border-radius:12px;padding:4px;gap:4px;margin:0 0 12px}.seg button{flex:1;border:0;background:none;border-radius:9px;min-height:42px;font:600 .92rem system-ui,sans-serif;color:var(--moss-d);cursor:pointer}.seg button.on{background:var(--card);box-shadow:0 1px 3px rgba(0,0,0,.22)}
body.hc{--mute:#3d3d30;--line:#9d927a;--paper:#fff}
h1,h2,h3{font-family:"Iowan Old Style","Palatino Linotype",Palatino,Georgia,serif;margin:0;color:var(--moss-d)}
h2{font-size:1.35rem;margin:22px 0 10px}h3{font-size:1.05rem;margin:0 0 6px}
header.top{background:var(--moss);color:#fff;padding:calc(10px + env(safe-area-inset-top)) 16px 12px;position:sticky;top:0;z-index:20;display:flex;align-items:center;gap:10px}
header.top b{font-family:"Iowan Old Style",Palatino,Georgia,serif;font-size:1.15rem;font-weight:700;letter-spacing:.2px}
header.top .arrow{height:36px;width:auto;transform:none}header.top small{display:block;opacity:.8;font-size:.72rem}
.arrow{width:26px;height:26px;flex:none}
main{overflow-x:clip;max-width:880px;margin:0 auto;padding:12px 14px 30px}
nav.tabs{position:fixed;left:0;right:0;bottom:0;background:var(--card);border-top:1px solid var(--line);display:flex;padding-bottom:env(safe-area-inset-bottom);z-index:30}
nav.tabs button{flex:1;min-width:0;border:0;background:none;padding:8px 2px 7px;color:var(--mute);font-size:.66rem;display:flex;flex-direction:column;align-items:center;gap:3px;cursor:pointer;min-height:56px}
nav.tabs button svg{width:22px;height:22px;stroke:currentColor;fill:none;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}
nav.tabs button.on{color:var(--moss);font-weight:700;box-shadow:inset 0 3px 0 var(--arrow)}
.card{background:var(--card);border:1px solid var(--line);border-radius:var(--r);padding:14px;margin:0 0 12px}
.hero{background:var(--moss);color:#fff;border-radius:var(--r);padding:16px;margin-bottom:12px}
.hero label{font-size:.85rem;opacity:.9}
.hero .kmrow{display:flex;gap:10px;align-items:stretch;margin-top:6px;flex-wrap:wrap}
.hero input{flex:1 1 120px;min-width:0;font:700 2.4rem/1 "Iowan Old Style",Palatino,Georgia,serif;padding:10px 12px;border-radius:12px;border:2px solid var(--arrow);background:var(--paper);color:var(--moss-d);text-align:center}
.hero .note{font-size:.76rem;opacity:.85;margin:8px 0 0}
.btn{border:0;border-radius:12px;padding:12px 16px;font-weight:700;font-size:.95rem;cursor:pointer;min-height:46px;background:var(--moss);color:#fff;display:inline-flex;align-items:center;justify-content:center;gap:6px;text-decoration:none}
.btn.arrow-btn{background:var(--arrow);color:#2b2500;flex:1 1 180px}
.btn.alt{background:var(--sand);color:var(--moss-d)}.btn.out{background:var(--card);color:var(--moss-d);border:1.5px solid var(--moss-d)}
.btn.danger{background:var(--card);color:var(--warn);border:1.5px solid var(--warn)}.btn.sm{min-height:38px;padding:7px 11px;font-size:.82rem;border-radius:10px}
.btn.wa{background:#1f9e4d}.btn.wa.q{background:var(--card);color:#1f9e4d;border:1.5px dashed #1f9e4d}
.btn:disabled{opacity:.5}
.grid{display:grid;grid-template-columns:repeat(2,1fr);gap:10px}
@media(min-width:640px){.grid{grid-template-columns:repeat(4,1fr)}}
.stat{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:10px 12px}
.stat span{display:block;font-size:.72rem;color:var(--mute)}.stat b{display:block;font-size:1.15rem;font-family:"Iowan Old Style",Palatino,Georgia,serif;color:var(--moss-d);word-break:break-word}
.stat small{color:var(--mute);font-size:.72rem}
.stat.wide{grid-column:span 2}
.bar{height:10px;border-radius:6px;background:var(--moss-l);overflow:hidden;margin-top:6px}.bar i{display:block;height:100%;background:var(--moss)}
.hero .bar{background:rgba(255,255,255,.25)}.hero .bar i{background:var(--arrow)}
.chips{display:flex;gap:8px;overflow-x:auto;padding:2px 0 8px;scrollbar-width:none}
.chip{border:1.5px solid var(--line);background:var(--card);border-radius:99px;padding:7px 13px;font-size:.85rem;white-space:nowrap;cursor:pointer;color:var(--ink)}
.chip.on{background:var(--moss);border-color:var(--moss);color:#fff}
.badge{display:inline-block;font-size:.7rem;border-radius:6px;padding:2px 7px;background:var(--sand);color:var(--moss-d);margin:2px 4px 2px 0}
.badge.w{background:var(--warnbg);color:var(--warn)}.badge.g{background:var(--moss-l);color:var(--moss-d)}.badge.k{background:var(--kbg);color:var(--mute)}
.lod{display:flex;gap:12px}.lod .d{flex:none;width:76px;text-align:center;border-right:1px dashed var(--line);padding-right:10px}
.lod .d b{display:block;font:700 1.7rem/1 "Iowan Old Style",Palatino,Georgia,serif;color:var(--moss)}.lod .d span{font-size:.7rem;color:var(--mute)}
.lod .d.back b{color:var(--mute)}.lod .d.here b{color:var(--clay)}
.lod .m{flex:1;min-width:0}.lod h3{font-size:1.02rem}
.sub{font-size:.8rem;color:var(--mute)}
.actions{display:flex;flex-wrap:wrap;gap:7px;margin-top:9px}
label.f{display:block;font-size:.8rem;color:var(--mute);margin:10px 0 3px}
select{min-width:0;max-width:100%;text-overflow:ellipsis;white-space:nowrap}input,select,textarea{min-width:0;max-width:100%;width:100%;font:inherit;padding:10px 11px;border:1.5px solid var(--line);border-radius:10px;background:var(--card);color:var(--ink);min-height:44px}
textarea{min-height:70px}input:focus,select:focus,textarea:focus,button:focus-visible,a:focus-visible{outline:3px solid var(--arrow);outline-offset:1px}
.row2{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);gap:10px;align-items:end}.row2>div{min-width:0;display:flex;flex-direction:column;justify-content:flex-end}
input[type=date]{-webkit-appearance:none;appearance:none;display:block;min-width:0;max-width:100%;text-align:left;line-height:1.2}input[type=date]::-webkit-date-and-time-value{text-align:left}input[type=date]::-webkit-datetime-edit{padding:0}
.empty{text-align:center;color:var(--mute);padding:26px 14px;border:2px dashed var(--line);border-radius:var(--r);background:var(--card)}
.empty b{display:block;color:var(--moss-d);margin-bottom:4px}
.warnbox{background:var(--note);border:1px solid var(--noteb);border-radius:12px;padding:10px 12px;font-size:.8rem;margin:0 0 12px;color:var(--notet)}
.err{background:var(--warnbg);color:var(--warn);border-radius:10px;padding:9px 12px;font-size:.88rem;margin:10px 0}
.toast{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(86px + env(safe-area-inset-bottom));background:var(--moss-d);color:#fff;padding:11px 18px;border-radius:12px;z-index:90;max-width:90%;font-size:.9rem;box-shadow:0 6px 20px rgba(0,0,0,.25)}
.toast.bad{background:var(--warn)}
dialog{border:0;border-radius:18px;padding:0;width:min(560px,94vw);max-height:92vh;background:var(--paper);color:var(--ink)}
dialog::backdrop{background:rgba(20,30,15,.55)}
dialog .hd{position:sticky;top:0;background:var(--moss);color:#fff;padding:13px 16px;display:flex;justify-content:space-between;align-items:center;z-index:2}
dialog .hd b{font-family:"Iowan Old Style",Palatino,Georgia,serif;font-size:1.1rem}dialog .hd button{background:none;border:0;color:#fff;font-size:1.6rem;line-height:1;min-width:40px;min-height:40px}
dialog .bd{padding:6px 16px 18px;overflow:auto;max-height:calc(92vh - 56px)}
table.t{width:100%;border-collapse:collapse;font-size:.85rem}table.t th{text-align:left;font-size:.72rem;color:var(--mute);border-bottom:1px solid var(--line);padding:5px 4px}table.t td{padding:7px 4px;border-bottom:1px solid var(--line2);vertical-align:top}
.t.fin{font-size:.7rem;table-layout:fixed;min-width:0}.t.fin th,.t.fin td{padding:6px 1px;white-space:nowrap}.t.fin td:first-child,.t.fin th:first-child{width:25%;white-space:normal}.ramal{display:block;width:100%;text-align:left;cursor:pointer;color:var(--ink);font:inherit;margin:0 0 8px}.ramal b{display:block;font-size:1.02rem}.r{text-align:right}.neg{color:var(--warn)}.pos{color:var(--ok)}
.hbar{display:flex;align-items:center;gap:8px;font-size:.82rem;margin:5px 0}.hbar span{flex:0 0 110px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}.hbar i{display:block;height:11px;background:var(--moss);border-radius:4px;min-width:2px}.hbar b{white-space:nowrap}
.cols{display:flex;align-items:flex-end;gap:4px;height:90px;border-bottom:1px solid var(--line);padding-top:6px;overflow-x:auto}.cols div{flex:1 0 18px;background:var(--clay);border-radius:3px 3px 0 0;position:relative;min-height:2px}.cols div small{position:absolute;bottom:-16px;left:-4px;right:-4px;text-align:center;font-size:.55rem;color:var(--mute)}
details>summary{cursor:pointer;font-weight:600;color:var(--moss);padding:6px 0}
.dayhd{display:flex;justify-content:space-between;align-items:baseline;margin:14px 0 6px;font-weight:700;color:var(--moss-d)}
.item{display:flex;justify-content:space-between;gap:10px;padding:9px 0;border-bottom:1px solid var(--line2)}.item:last-child{border:0}
.item .v{font-weight:700;white-space:nowrap}
.sep{height:1px;background:var(--line);margin:12px 0}
.small{font-size:.78rem;color:var(--mute)}
</style>
</head>

<script>
/* ===== NÚCLEO: cálculos, formatação, CSV e PDF (sem dependências) ===== */
const Core=(()=>{
let REF=317; /* marco da placa no ponto de partida do ramal (km regressivo do PDF) */
function setRef(n){REF=n>0?Number(n):317;}
const R=(n)=>(Number(n)||0);
const round2=(n)=>Math.round((R(n)+Number.EPSILON)*100)/100;
const brl=(n)=>round2(n).toLocaleString('pt-BR',{style:'currency',currency:'BRL'});
const num=(n,d=1)=>R(n).toLocaleString('pt-BR',{minimumFractionDigits:0,maximumFractionDigits:d});
const pad=(n)=>String(n).padStart(2,'0');
const isoDate=(d)=>d.getFullYear()+'-'+pad(d.getMonth()+1)+'-'+pad(d.getDate());
const parseISO=(s)=>{if(!s)return null;const m=/^(\d{4})-(\d{2})-(\d{2})$/.exec(s);if(!m)return null;const d=new Date(+m[1],+m[2]-1,+m[3]);return isNaN(d)?null:d;};
const brDate=(s)=>{const d=typeof s==='string'?parseISO(s.slice(0,10)):s;return d?pad(d.getDate())+'/'+pad(d.getMonth()+1)+'/'+d.getFullYear():'—';};
const brDateTime=(iso)=>{const d=new Date(iso);return isNaN(d)?'—':brDate(d)+' '+pad(d.getHours())+':'+pad(d.getMinutes());};
const addDays=(d,n)=>{const x=new Date(d.getFullYear(),d.getMonth(),d.getDate());x.setDate(x.getDate()+n);return x;};
const diffDays=(a,b)=>Math.round((Date.UTC(b.getFullYear(),b.getMonth(),b.getDate())-Date.UTC(a.getFullYear(),a.getMonth(),a.getDate()))/864e5);
/* valores digitados em pt-BR ("1.234,56" ou "120,5" ou "120.50") */
const parseMoney=(s)=>{if(typeof s==='number')return isFinite(s)&&s>=0?round2(s):NaN;let t=String(s??'').replace(/[R$\s]/g,'');if(!t)return NaN;
  if(t.includes(',')){t=t.replace(/\./g,'').replace(',','.');}else if((t.match(/\./g)||[]).length>1){t=t.replace(/\./g,'');}
  const v=Number(t);return isFinite(v)&&v>=0?round2(v):NaN;};
const parseKm=(s)=>{if(typeof s==='number')return isFinite(s)&&s>=0?s:NaN;let t=String(s??'').trim().replace(/\s/g,'');if(!t)return NaN;
  t=t.includes(',')?t.replace(/\./g,'').replace(',','.'):t;const v=Number(t);return isFinite(v)&&v>=0?v:NaN;};
const uid=(p='x')=>p+Date.now().toString(36)+Math.random().toString(36).slice(2,8);

/* ---- posição e distâncias ---- */
function marcoDe(acc){return round2(REF-R(acc));}
function kmAtual(st){const h=st.kmHist||[];return h.length?R(h[h.length-1].km):R(st.cfg.kmInicial);}
function distRestante(kmHosp,kmAt){return kmHosp==null||kmHosp===''?null:round2(R(kmHosp)-R(kmAt));}
function situacao(d){if(d==null)return'sem-km';if(Math.abs(d)<0.05)return'no-ponto';return d>0?'a-frente':'para-tras';}
function diasCaminhada(dist,media){if(dist==null||!(media>0))return null;return dist>0?Math.ceil(dist/media-1e-9):0;}
function dataBase(st,hoje){const ini=parseISO(st.cfg.inicio);const percorrido=kmAtual(st)-R(st.cfg.kmInicial);
  if(!ini)return hoje;if(percorrido<=0||hoje<ini)return ini;return hoje;}
function dataChegada(st,dist,hoje){const n=diasCaminhada(dist,R(st.cfg.media));if(n==null)return null;return addDays(dataBase(st,hoje),n);}
function proximas(st,hoje,f={}){const at=kmAtual(st);
  return (st.hosp||[]).filter(h=>h.ativo!==false).map(h=>{const d=distRestante(h.km_inicio,at);return{h,dist:d,sit:situacao(d),eta:d!=null&&d>=0?dataChegada(st,d,hoje):null,dias:d!=null&&d>=0?diasCaminhada(d,R(st.cfg.media)):null};})
  .filter(x=>x.dist!=null&&x.dist>=-0.05).filter(x=>{
    if(f.tipo&&f.tipo!=='todos'&&x.h.tipo!==f.tipo)return false;
    if(f.ramal&&f.ramal!=='todos'&&x.h.ramal&&x.h.ramal!==f.ramal)return false;
    if(f.max&&x.dist>f.max)return false;
    if(f.municipio&&x.h.municipio!==f.municipio)return false;
    if(f.categoria&&x.h.categoria!==f.categoria)return false;
    if(f.precoMax&&!(x.h.preco_min!=null&&x.h.preco_min<=f.precoMax))return false;
    if(f.disp&&f.disp!=='todas'&&(x.h.disponibilidade||'desconhecida')!==f.disp)return false;
    if(!temComodidades(x.h,f.am))return false;
    if(f.cred&&!x.h.credencial)return false;
    if(f.q&&!norm(x.h.nome+' '+x.h.municipio).includes(norm(f.q)))return false;
    return true;}).sort((a,b)=>a.dist-b.dist||a.h.nome.localeCompare(b.h.nome));}
const norm=(s)=>String(s||'').normalize('NFD').replace(/[\u0300-\u036f]/g,'').toLowerCase();

/* ---- contatos ---- */
const digits=(s)=>String(s||'').replace(/\D/g,'');
function foneInfo(num){const d=digits(num);let n=d.startsWith('55')&&d.length>=12?d.slice(2):d;
  const ok=(n.length===10||n.length===11);const movel=n.length===11&&n[2]==='9';return{digits:n,valido:ok,movel};}
function waLink(num){const i=foneInfo(num);return i.valido&&i.movel?'https://wa.me/55'+i.digits:null;}
function mapsLink(h){const q=[h.nome,h.endereco,h.municipio].filter(Boolean).join(', ');return q?'https://www.google.com/maps/search/?api=1&query='+encodeURIComponent(q):null;}

/* ---- reservas e finanças ---- */
function diarias(ent,sai){const a=parseISO(ent),b=parseISO(sai);if(!a||!b)return NaN;const n=diffDays(a,b);return n>0?n:NaN;}
function totalReserva(r){const n=R(r.diarias);return round2(n*R(r.valorDiaria)+R(r.taxas));}
function pagoReserva(st,rid){return round2((st.pagamentos||[]).filter(p=>p.reservaId===rid).reduce((s,p)=>s+R(p.valor),0));}
function pendenteReserva(st,r){return Math.max(0,round2(totalReserva(r)-pagoReserva(st,r.id)));}
function statusPag(st,r){const t=totalReserva(r),p=pagoReserva(st,r.id);if(p<=0)return'não pago';return p+0.004>=t?'pago':'parcialmente pago';}
function finance(st,hoje){const res=(st.reservas||[]).filter(r=>r.status!=='cancelada');
  const hospPrev=round2(res.reduce((s,r)=>s+totalReserva(r),0));
  const hospConf=round2(res.filter(r=>r.status==='confirmada').reduce((s,r)=>s+totalReserva(r),0));
  const hospPago=round2((st.pagamentos||[]).filter(p=>res.some(r=>r.id===p.reservaId)).reduce((s,p)=>s+R(p.valor),0));
  const hospPend=round2(res.reduce((s,r)=>s+pendenteReserva(st,r),0));
  const hospInc=round2(res.filter(r=>{const e=parseISO(r.entrada);return e&&e<=hoje;}).reduce((s,r)=>s+totalReserva(r),0));
  const sum=(a,f)=>round2(a.filter(f).reduce((s,x)=>s+R(x.valor),0));
  const alim=st.alimentacao||[],out=st.outros||[];

function vGastos(kind){const al=kind==='comida';const arr=al?S.alimentacao:S.outros;const cats=al?CAT_ALIM:[...CAT_OUT,...S.cats];const rg=FE[kind];
  const l=arr.filter(x=>(!rg.de||x.data>=rg.de)&&(!rg.ate||x.data<=rg.ate)).sort((a,b)=>b.data.localeCompare(a.data)||0);
  const tot=Core.round2(l.reduce((s,x)=>s+x.valor,0));const dias=[...new Set(l.map(x=>x.data))];const hj=isoDate(hoje());const totHoje=Core.round2(arr.filter(x=>x.data===hj).reduce((s,x)=>s+x.valor,0));
  const lim=Number(S.cfg.orcAlim)||0;const byDay=Core.porDia(l);const catT=Core.porCategoria(l),formaT=Core.porForma(l);const max=Math.max(...catT.map(c=>c[1]),1);
  let h=`<h2 style="margin-top:6px">${al?'Alimentação':'Demais custos'}</h2><div class="grid"><div class="stat"><span>Total hoje</span><b>${brl(totHoje)}</b>${al&&lim?`<small class="${totHoje>lim?'neg':''}">${totHoje>lim?'acima':'dentro'} do limite de ${brl(lim)}</small>`:''}</div><div class="stat"><span>Total ${rg.de||rg.ate?'do período':'acumulado'}</span><b>${brl(tot)}</b></div>
  <div class="stat"><span>Média por dia com gastos</span><b>${brl(dias.length?tot/dias.length:0)}</b></div><div class="stat"><span>Lançamentos</span><b>${l.length}</b></div></div>
  <div class="actions" style="margin:12px 0"><button class="btn" data-a="newg" data-k="${kind}">+ Novo lançamento</button>${al?'':'<button class="btn alt" data-a="newcat">+ Categoria</button>'}</div>
  ${al?vOndeComer():''}<div class="card"><div class="row2"><div><label class="f">De</label><input type="date" data-a="fedt" data-k="${kind}" data-w="de" value="${rg.de}"></div><div><label class="f">Até</label><input type="date" data-a="fedt" data-k="${kind}" data-w="ate" value="${rg.ate}"></div></div>${rg.de||rg.ate?`<button class="btn sm alt" style="margin-top:8px" data-a="feclr" data-k="${kind}">Limpar período</button>`:''}</div>`;
  if(!l.length)return h+`<div class="empty"><b>Nenhum lançamento${rg.de||rg.ate?' neste período':' ainda'}</b>Toque em “+ Novo lançamento” para registrar ${al?'sua primeira refeição':'uma despesa'}.</div>`;
  h+=`<div class="card"><h3>Por categoria</h3>${catT.map(([k,v])=>`<div class="hbar"><span>${esc(k)}</span><i style="width:${v/max*55}%"></i><b>${brl(v)}</b></div>`).join('')}<div class="sep"></div><h3>Por forma de pagamento</h3>${formaT.map(([k,v])=>`<div class="hbar"><span>${esc(k)}</span><b>${brl(v)}</b></div>`).join('')}</div>`;
  if(!al){const ks=Object.keys(byDay).sort().slice(-20);const mx=Math.max(...ks.map(k=>byDay[k]),1);h+=`<div class="card"><h3>Evolução por dia</h3><div class="cols" style="margin-bottom:18px">${ks.map(k=>`<div style="height:${Math.max(byDay[k]/mx*100,3)}%" title="${brDate(k)}: ${brl(byDay[k])}"><small>${brDate(k).slice(0,5)}</small></div>`).join('')}</div></div>`;}
  h+='<div class="card">';dias.forEach(d=>{const ds=l.filter(x=>x.data===d);const t=Core.round2(ds.reduce((s,x)=>s+x.valor,0));
    h+=`<div class="dayhd"><span>${brDate(d)}</span><span class="${al&&lim&&t>lim?'neg':''}">${brl(t)}${al&&lim&&t>lim?' · acima do limite':''}</span></div>`+ds.map(x=>`<div class="item"><div><b>${esc(x.categoria)}</b>${x.descricao?' · '+esc(x.descricao):''}<div class="small">${esc(x.forma||'')}${x.municipio?' · '+esc(x.municipio):''}${x.status==='pendente'?' · <span class="neg">pendente</span>':''}${x.obs?' · '+esc(x.obs):''}</div></div><div style="text-align:right"><div class="v">${brl(x.valor)}</div><button class="btn sm alt" data-a="editg" data-k="${kind}" data-id="${x.id}">Editar</button> <button class="btn sm danger" data-a="delg" data-k="${kind}" data-id="${x.id}">Excluir</button></div></div>`).join('');});
  return h+'</div>';}

  case'sharepdf':{e.preventDefault();try{const f=new File([lastPdf.blob],lastPdf.name,{type:'application/pdf'});if(navigator.canShare({files:[f]}))await navigator.share({files:[f],title:'Relatório Caminho da Fé'});}catch(err){}break;}
  case'bkout':download(JSON.stringify({app:'meu-caminho-da-fe',versao_app:APP_VERSAO,gerado:new Date().toISOString(),dados:S},null,1),`backup-caminho-da-fe-${isoDate(new Date())}.json`,'application/json');toast('Backup exportado');break;
  case'bkin':$('#fileIn').dataset.mode='bk';$('#fileIn').accept='.json,application/json';$('#fileIn').value='';$('#fileIn').click();break;
  case'reset':if(await ask('Apagar TODOS os dados (reservas, gastos, histórico) e restaurar a base original do PDF?')&&await ask('Tem certeza? Esta ação não pode ser desfeita. Faça um backup antes.')){S=fresh();save();render();toast('Dados reiniciados');}break;
  }});
document.addEventListener('change',(e)=>{const el=e.target;const a=el.dataset&&el.dataset.a;
  if(a==='fsel'){F[el.dataset.k]=el.dataset.k==='precoMax'?+el.value:el.value;F.n=15;render();}
  else if(a==='flsel'){FL[el.dataset.k]=el.value;FL.n=40;render();}
  else if(a==='fedt'){FE[el.dataset.k][el.dataset.w]=el.value;render();}
  else if(a==='dispsel'){const h=S.hosp.find(x=>x.id===el.dataset.id);h.disponibilidade=el.value;save();toast('Disponibilidade registrada');}
  else if(a==='notas'){const h=S.hosp.find(x=>x.id===el.dataset.id);h.notas=el.value;save();}
  else if(el.id==='rHosp'){const h=S.hosp.find(x=>x.id===el.value);if(h){const f=$('#fR');f.nome.value=h.nome;f.municipio.value=h.municipio||'';f.endereco.value=h.endereco||'';f.telefone.value=fone(h)[0]?.numero||'';if(h.preco_min!=null)f.valorDiaria.value=String(h.preco_min).replace('.',',');recalcRes();}}
  else if(el.id==='fileIn')importFile(el);});
let tq;document.addEventListener('input',(e)=>{const el=e.target;if(el.dataset&&el.dataset.a==='fq'){F.q=el.value;F.n=15;clearTimeout(tq);tq=setTimeout(()=>{render();const i=document.querySelector('[data-a=fq]');if(i){i.focus();i.setSelectionRange(99,99);}},350);}
  if(el.dataset&&el.dataset.a==='flq'){FL.q=el.value;FL.n=40;clearTimeout(tq);tq=setTimeout(()=>{render();const i=document.querySelector('[data-a=flq]');if(i){i.focus();i.setSelectionRange(99,99);}},350);}
  if(el.closest&&el.closest('#fR'))recalcRes();});
async function restoreFrom(j){const d=j.dados||j;if(!d.cfg||!Array.isArray(d.reservas)||!Array.isArray(d.hosp))throw new Error('Arquivo de backup inválido');
  if(!await ask('Restaurar este backup substitui todos os dados atuais. Continuar?'))return;const f0=fresh();S={...f0,...d,cfg:{...f0.cfg,...d.cfg}};save();closeDlg();render();toast('Backup restaurado');}
function importFile(el){const f=el.files[0];if(!f)return;if(el.dataset.mode==='pdf'){processarPdf(f);return;}const rd=new FileReader();rd.onload=async()=>{try{
  if(el.dataset.mode==='csv'){const r=Core.fromCSV(String(rd.result));if(!r.itens.length){toast('Nenhum registro válido. '+(r.erros[0]||''),1);return;}
    const m=Core.mesclarBase(S.hosp,r.itens);save();render();openDlg('Importação concluída',`<p><b>${r.itens.length}</b> linha(s) válida(s): ${m.add} novo(s), ${m.upd} atualizado(s). Registros com o mesmo id não são duplicados.</p>${r.erros.length?`<div class="err"><b>${r.erros.length} linha(s) ignorada(s):</b><br>${r.erros.slice(0,10).map(esc).join('<br>')}</div>`:''}`);}
  else{await restoreFrom(JSON.parse(String(rd.result)));}}catch(err){toast('Falha na importação: '+err.message,1);}};rd.readAsText(f,'utf-8');}
document.addEventListener('submit',async(e)=>{e.preventDefault();const f=e.target;const err=(m)=>{$('#fErr')?($('#fErr').innerHTML=`<div class="err">${esc(m)}</div>`):0;};const v=(n)=>(f[n]?f[n].value.trim():'');
  if(f.id==='cfgForm'){const km=parseKm(v('kmInicial')||'0'),media=parseKm(v('media')),tot=v('total')?parseKm(v('total')):0,orc=v('orcamento')?parseMoney(v('orcamento')):'',oa=v('orcAlim')?parseMoney(v('orcAlim')):'',ds=v('descanso')?parseInt(v('descanso'),10):0;
    const E=(m)=>{$('#cfgErr').innerHTML=`<div class="err">${esc(m)}</div>`;};
    if(!parseISO(v('inicio')))return E('Informe uma data de início válida.');if(isNaN(km))return E('Km inicial inválido.');if(isNaN(media)||media<=0)return E('A média diária deve ser maior que zero.');if(isNaN(tot))return E('Distância total inválida.');if(tot&&tot<=km)return E('A distância total deve ser maior que o km inicial.');
    if(orc!==''&&isNaN(orc))return E('Orçamento total inválido.');if(oa!==''&&isNaN(oa))return E('Orçamento de alimentação inválido.');if(isNaN(ds)||ds<0)return E('Dias de descanso inválidos.');
    Object.assign(S.cfg,{inicio:v('inicio'),kmInicial:km,media,total:tot,orcamento:orc,orcAlim:oa,descanso:ds,ramal:v('ramal'),proxy:v('proxy'),tema:v('tema'),modoKm:v('modoKm'),grande:f.grande.checked,contraste:f.contraste.checked,credTopo:f.credTopo.checked});save();render();toast('Configurações salvas');return;}
  if(f.id==='fH'){const nome=v('nome');if(!nome)return err('Informe o nome.');const km=v('km_inicio')?parseKm(v('km_inicio')):null;if(km!==null&&isNaN(km))return err('Quilometragem inválida (use número maior ou igual a zero).');
    const kp=v('km_pdf')?parseKm(v('km_pdf')):null;if(kp!==null&&isNaN(kp))return err('Km original inválido.');const pmin=v('preco_min')?parseMoney(v('preco_min')):null,pmax=v('preco_max')?parseMoney(v('preco_max')):null;if((pmin!==null&&isNaN(pmin))||(pmax!==null&&isNaN(pmax)))return err('Valor de diária inválido.');if(pmin!==null&&pmax!==null&&pmax<pmin)return err('A diária máxima não pode ser menor que a mínima.');
    const tel=v('telefones').split('|').map(s=>s.trim()).filter(Boolean).map(s=>({numero:s.replace('*','').trim(),whatsapp:s.includes('*')}));
    const o={nome,municipio:v('municipio'),uf:v('uf').toUpperCase(),tipo:v('tipo'),categoria:v('categoria')||'Pousada',km_inicio:km,km_pdf:kp,preco_min:pmin,preco_max:pmax,telefones:tel,endereco:v('endereco'),email:v('email'),observacoes:v('observacoes')};
    if(f.dataset.id){const h=S.hosp.find(x=>x.id===f.dataset.id);Object.assign(h,o,{revisar:h.revisar});if(String(h.origem||'').startsWith('pdf'))h.editado=true;}else S.hosp.push({id:Core.uid('h'),...o,preco_apartir:false,preco_texto:'',incluso:'',contato:'',site:'',instagram:'',credencial:false,ramal:'',fora_trilha_km:null,revisar:[],origem:'manual',disponibilidade:'desconhecida',notas:''});
    save();closeDlg();render();toast('Registro salvo');return;}
  if(f.id==='fR'){const nome=v('nome');if(!nome)return err('Informe o nome da hospedagem.');const n=Core.diarias(v('entrada'),v('saida'));if(isNaN(n))return err('Datas inválidas: a saída deve ser depois da entrada.');
    const vd=parseMoney(v('valorDiaria'));if(isNaN(vd))return err('Valor da diária inválido.');const tx=parseMoney(v('taxas')||'0');if(isNaN(tx))return err('Valor das taxas inválido.');
    const o={nome,municipio:v('municipio'),endereco:v('endereco'),telefone:v('telefone'),hospId:v('hospId')||null,entrada:v('entrada'),saida:v('saida'),diarias:n,valorDiaria:vd,taxas:tx,status:v('status'),codigo:v('codigo'),obs:v('obs')};
    if(f.dataset.id)Object.assign(S.reservas.find(r=>r.id===f.dataset.id),o);else S.reservas.push({id:Core.uid('r'),...o});save();closeDlg();render();toast('Reserva salva — total '+brl(n*vd+tx));return;}
  if(f.id==='fP'){const val=parseMoney(v('valor'));if(isNaN(val)||val<=0)return err('Informe um valor de pagamento maior que zero.');if(!parseISO(v('data')))return err('Data inválida.');
    const r=S.reservas.find(x=>x.id===f.dataset.id);const pend=Core.pendenteReserva(S,r);if(val>pend+0.004&&!await ask(`O pagamento (${brl(val)}) é maior que o valor pendente (${brl(pend)}). Registrar mesmo assim?`))return;
    S.pagamentos.push({id:Core.uid('p'),reservaId:r.id,data:v('data'),valor:val,forma:v('forma'),obs:v('obs')});save();closeDlg();render();toast('Pagamento registrado');return;}
  if(f.id==='fG'){const val=parseMoney(v('valor'));if(isNaN(val)||val<=0)return err('Informe um valor maior que zero (ex.: 25,00).');if(!parseISO(v('data')))return err('Data inválida.');
    const o={data:v('data'),categoria:v('categoria'),descricao:v('descricao'),municipio:f.municipio?v('municipio'):'',valor:val,forma:v('forma'),status:v('status'),obs:v('obs')};const arr=f.dataset.k==='comida'?S.alimentacao:S.outros;
    if(f.dataset.id)Object.assign(arr.find(x=>x.id===f.dataset.id),o);else arr.push({id:Core.uid('g'),...o});save();closeDlg();render();toast('Lançamento salvo');return;}});
