<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#3F5B3A"><link rel="manifest" href="manifest.webmanifest"><link rel="icon" type="image/png" href="icon-180.png"><link rel="apple-touch-icon" href="icon-180.png"><meta name="apple-mobile-web-app-capable" content="yes"><meta name="apple-mobile-web-app-title" content="Caminho da Fé"><meta name="color-scheme" content="light">
<title>Meu Caminho da Fé</title>
<style>
:root{color-scheme:light;--warnbg:#FBE4D4;--note:#FFF6DD;--noteb:#E8D28A;--notet:#5a4a10;--line2:#eee3cf;--kbg:#E8E8E8;color-scheme:light;--moss:#3F5B3A;--moss-d:#2C4129;--moss-l:#DDE6D3;--sand:#EFE8D8;--paper:#FBF8F1;--card:#fff;--clay:#A5603A;--ink:#26301F;--mute:#6B6A58;--line:#DDD3BC;--warn:#B3541E;--ok:#2F7A3E;--arrow:#F2C230;--r:14px}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
:root[data-theme=dark]{--paper:#161a14;--card:#1f261c;--ink:#e9e6da;--mute:#a9ab97;--line:#3a4434;--line2:#2c3527;--sand:#2b3326;--moss-l:#2d3c29;--moss:#4f7348;--moss-d:#c5dbb2;--clay:#d98e62;--warn:#ff9a63;--ok:#7fd08c;--warnbg:#4a2a19;--note:#3a3316;--noteb:#6b5c20;--notet:#efe0a6;--kbg:#2f372b;color-scheme:dark}

html{font-size:16px;-webkit-text-size-adjust:100%;max-width:100%}html.big{font-size:19px}
body{margin:0;background:var(--paper);color:var(--ink);font-family:system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;line-height:1.4;padding-bottom:calc(74px + env(safe-area-inset-bottom))}
header.top button.thm{margin-left:auto;background:rgba(255,255,255,.15);border:0;border-radius:10px;color:#fff;min-width:42px;min-height:42px;cursor:pointer}header.top button.thm svg{width:22px;height:22px;stroke:#fff;fill:none;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
button.card.ramal{display:block;width:100%;text-align:left;cursor:pointer;color:var(--ink);font:inherit;margin-bottom:10px}button.card.ramal b{display:block;color:var(--moss-d)}button.card.ramal:active{background:var(--sand)}
svg.mapa{width:100%;height:auto;display:block}svg.mapa .cn{stroke:var(--ink);stroke-opacity:.3;stroke-linejoin:round;stroke-linecap:round}svg.mapa .cn.mj{stroke-opacity:.5}:root[data-theme=dark] svg.mapa .terreno{opacity:.18}
svg.mapa text{font:600 10px system-ui,sans-serif;fill:var(--ink)}svg.mapa .mu{fill:var(--mute);font-weight:500}
#mapsvgbox{touch-action:none;cursor:grab;border-radius:12px;overflow:hidden;background:var(--sand)}#mapsvgbox:active{cursor:grabbing}.mapbox{position:relative}.mapctl{display:flex;flex-wrap:wrap;gap:6px;margin-top:6px}.mapctl button{min-width:48px;min-height:40px;border-radius:10px;border:1.5px solid var(--moss-d);background:var(--card);color:var(--moss-d);font:600 .82rem system-ui,sans-serif;cursor:pointer;padding:0 11px}
.seg{display:flex;background:var(--sand);border-radius:12px;padding:4px;gap:4px;margin:0 0 12px}.seg button{flex:1;border:0;background:none;border-radius:9px;min-height:42px;font:600 .92rem system-ui,sans-serif;color:var(--moss-d);cursor:pointer}.seg button.on{background:var(--card);box-shadow:0 1px 3px rgba(0,0,0,.22)}
.badge.fav{background:var(--note);color:var(--notet);border:1px solid var(--noteb)}
.ib{display:inline-flex;align-items:center;gap:6px;border:0;background:none;padding:2px;cursor:pointer;border-radius:12px;text-decoration:none;color:inherit;font:inherit;position:relative}
.sub .badge{margin-left:8px}
.ib .ibl{position:absolute;left:-9999px;top:auto;width:1px;height:1px;overflow:hidden}
.ib.ibi svg{width:40px;height:40px;display:block}
.ib.ibt{padding:7px 12px;border:1.5px solid var(--moss-d);border-radius:12px;color:var(--moss-d);font-weight:600;font-size:.85rem;background:var(--card)}
.ib.ibt .ibg{display:none}.ib.ibt .ibl{position:static;width:auto;height:auto;overflow:visible}
.ibrow{display:flex;flex-wrap:wrap;gap:8px;align-items:center;margin-top:8px}
.t.fin td,.t.fin th{white-space:normal;word-break:normal}
.t.fin{table-layout:fixed;width:100%}.t.fin th:first-child,.t.fin td:first-child{width:40%}.t.fin th.r,.t.fin td.r{text-align:right;width:20%}
.badge.back{background:none;color:#B3261E;font-weight:700;padding:0}
:root[data-theme=dark] .badge.back{color:#FF8A80}

.ib.ibi img.ico{height:30px;width:auto;display:block;}.ib.ibi img.off{opacity:.45}
body.hc{--mute:#3d3d30;--line:#9d927a;--paper:#fff}
:root[data-theme=dark] body.hc{--mute:#f2efe2;--ink:#ffffff;--line:#b9b08f;--paper:#101410;--card:#1f261c}
h1,h2,h3{font-family:"Iowan Old Style","Palatino Linotype",Palatino,Georgia,serif;margin:0;color:var(--moss-d)}
h2{font-size:1.35rem;margin:22px 0 10px}h3{font-size:1.05rem;margin:0 0 6px}
header.top{background:var(--moss);color:#fff;padding:calc(10px + env(safe-area-inset-top)) 16px 12px;position:sticky;top:0;z-index:20;display:flex;align-items:center;gap:10px}
header.top b{font-family:"Iowan Old Style",Palatino,Georgia,serif;font-size:1.15rem;font-weight:700;letter-spacing:.2px}
header.top .arrow{height:36px;width:auto;transform:none}header.top small{display:block;opacity:.8;font-size:.72rem}
.arrow{width:26px;height:26px;flex:none}
main{overflow-x:clip;max-width:880px;margin:0 auto;padding:12px 14px 30px}
nav.tabs{position:fixed;left:0;right:0;bottom:0;background:var(--card);border-top:1px solid var(--line);display:flex;padding-bottom:env(safe-area-inset-bottom);z-index:30}
nav.tabs button{flex:1;min-width:0;border:0;background:none;padding:8px 2px 7px;color:var(--mute);font-size:.66rem;display:flex;flex-direction:column;align-items:center;gap:3px;cursor:pointer;min-height:56px}
nav.tabs button svg{width:22px;height:22px;stroke:currentColor;fill:none;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}
nav.tabs button.on{color:var(--moss);font-weight:700;box-shadow:inset 0 3px 0 var(--arrow)}
.card{background:var(--card);border:1px solid var(--line);border-radius:var(--r);padding:14px;margin:0 0 12px}
.hero{background:var(--moss);color:#fff;border-radius:var(--r);padding:16px;margin-bottom:12px}
.hero label{font-size:.85rem;opacity:.9}
.hero .kmrow{display:flex;gap:10px;align-items:stretch;margin-top:6px;flex-wrap:wrap}
.hero input{flex:1 1 120px;min-width:0;font:700 2.4rem/1 "Iowan Old Style",Palatino,Georgia,serif;padding:10px 12px;border-radius:12px;border:2px solid var(--arrow);background:var(--paper);color:var(--moss-d);text-align:center}
.hero .note{font-size:.76rem;opacity:.85;margin:8px 0 0}
.btn{border:0;border-radius:12px;padding:12px 16px;font-weight:700;font-size:.95rem;cursor:pointer;min-height:46px;background:var(--moss);color:#fff;display:inline-flex;align-items:center;justify-content:center;gap:6px;text-decoration:none}
.btn.arrow-btn{background:var(--arrow);color:#2b2500;flex:1 1 180px}
.btn.alt{background:var(--sand);color:var(--moss-d)}.btn.out{background:var(--card);color:var(--moss-d);border:1.5px solid var(--moss-d)}
.btn.danger{background:var(--card);color:var(--warn);border:1.5px solid var(--warn)}.btn.sm{min-height:38px;padding:7px 11px;font-size:.82rem;border-radius:10px}
.btn.wa{background:#1f9e4d}.btn.wa.q{background:var(--card);color:#1f9e4d;border:1.5px dashed #1f9e4d}
.btn:disabled{opacity:.5}
.grid{display:grid;grid-template-columns:repeat(2,1fr);gap:10px;margin:0 0 12px}
@media(min-width:640px){.grid{grid-template-columns:repeat(4,1fr)}}
.stat{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:10px 12px}
.stat span{display:block;font-size:.72rem;color:var(--mute)}.stat b{display:block;font-size:1.15rem;font-family:"Iowan Old Style",Palatino,Georgia,serif;color:var(--moss-d);word-break:break-word}
.stat small{color:var(--mute);font-size:.72rem}
.stat.wide{grid-column:span 2}
.bar{height:10px;border-radius:6px;background:var(--moss-l);overflow:hidden;margin-top:6px}.bar i{display:block;height:100%;background:var(--moss)}
.hero .bar{background:rgba(255,255,255,.25)}.hero .bar i{background:var(--arrow)}
.chips{display:flex;gap:8px;overflow-x:auto;padding:2px 0 8px;scrollbar-width:none;margin-bottom:12px}
.chip{border:1.5px solid var(--line);background:var(--card);border-radius:99px;padding:7px 13px;font-size:.85rem;white-space:nowrap;cursor:pointer;color:var(--ink)}
.chip.on{background:var(--moss);border-color:var(--moss);color:#fff}
.badge{display:inline-block;font-size:.7rem;border-radius:6px;padding:2px 7px;background:var(--sand);color:var(--moss-d);margin:2px 4px 2px 0}
.badge.w{background:var(--warnbg);color:var(--warn)}.badge.g{background:var(--moss-l);color:var(--moss-d)}.badge.k{background:var(--kbg);color:var(--mute)}
.lod{display:flex;gap:12px}.lod .d{flex:none;width:76px;text-align:center;border-right:1px dashed var(--line);padding-right:10px}
.lod .d b{display:block;font:700 1.7rem/1 "Iowan Old Style",Palatino,Georgia,serif;color:var(--moss)}.lod .d span{font-size:.7rem;color:var(--mute)}
.lod .d.back b{color:var(--mute)}.lod .d.here b{color:var(--clay)}
.lod .m{flex:1;min-width:0}.lod h3{font-size:1.02rem}
.sub{font-size:.8rem;color:var(--mute)}
.actions{display:flex;flex-wrap:wrap;gap:7px;margin-top:9px}
label.f{display:block;font-size:.8rem;color:var(--mute);margin:10px 0 3px}
select{min-width:0;max-width:100%;text-overflow:ellipsis;white-space:nowrap}input,select,textarea{min-width:0;max-width:100%;width:100%;font:inherit;padding:10px 11px;border:1.5px solid var(--line);border-radius:10px;background:var(--card);color:var(--ink);min-height:44px}
textarea{min-height:70px}input:focus,select:focus,textarea:focus,button:focus-visible,a:focus-visible{outline:3px solid var(--arrow);outline-offset:1px}
.row2{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);gap:10px;align-items:end}.row2>div{min-width:0;display:flex;flex-direction:column;justify-content:flex-end}
input[type=date]{-webkit-appearance:none;appearance:none;display:block;min-width:0;max-width:100%;text-align:left;line-height:1.2}input[type=date]::-webkit-date-and-time-value{text-align:left}input[type=date]::-webkit-datetime-edit{padding:0}
.empty{text-align:center;color:var(--mute);padding:26px 14px;border:2px dashed var(--line);border-radius:var(--r);background:var(--card)}
.empty b{display:block;color:var(--moss-d);margin-bottom:4px}
.warnbox{background:var(--note);border:1px solid var(--noteb);border-radius:12px;padding:10px 12px;font-size:.8rem;margin:0 0 12px;color:var(--notet)}
.err{background:var(--warnbg);color:var(--warn);border-radius:10px;padding:9px 12px;font-size:.88rem;margin:10px 0}
.toast{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(86px + env(safe-area-inset-bottom));background:#2C4129;color:#fff;padding:11px 18px;border-radius:12px;z-index:90;max-width:90%;font-size:.9rem;box-shadow:0 6px 20px rgba(0,0,0,.25)}
.toast.bad{background:var(--warn)}
dialog{border:0;border-radius:18px;padding:0;width:min(560px,94vw);max-height:92vh;background:var(--paper);color:var(--ink)}
dialog::backdrop{background:rgba(20,30,15,.55)}
dialog .hd{position:sticky;top:0;background:var(--moss);color:#fff;padding:13px 16px;display:flex;justify-content:space-between;align-items:center;z-index:2}
dialog .hd b{font-family:"Iowan Old Style",Palatino,Georgia,serif;font-size:1.1rem}dialog .hd button{background:none;border:0;color:#fff;font-size:1.6rem;line-height:1;min-width:40px;min-height:40px}
dialog .bd{padding:6px 16px 18px;overflow:auto;max-height:calc(92vh - 56px)}
table.t{width:100%;border-collapse:collapse;font-size:.85rem}table.t th{text-align:left;font-size:.72rem;color:var(--mute);border-bottom:1px solid var(--line);padding:5px 4px}table.t td{padding:7px 4px;border-bottom:1px solid var(--line2);vertical-align:top}
.t.fin{font-size:.7rem;table-layout:fixed;min-width:0}.t.fin th,.t.fin td{padding:6px 1px;white-space:nowrap}.t.fin td:first-child,.t.fin th:first-child{width:25%;white-space:normal}.ramal{display:block;width:100%;text-align:left;cursor:pointer;color:var(--ink);font:inherit;margin:0 0 8px}.ramal b{display:block;font-size:1.02rem}.r{text-align:right}.neg{color:var(--warn)}.pos{color:var(--ok)}
.hbar{display:flex;align-items:center;gap:8px;font-size:.82rem;margin:5px 0}.hbar span{flex:0 0 110px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}.hbar i{display:block;height:11px;background:var(--moss);border-radius:4px;min-width:2px}.hbar b{white-space:nowrap}
.cols{display:flex;align-items:flex-end;gap:4px;height:90px;border-bottom:1px solid var(--line);padding-top:6px;overflow-x:auto}.cols div{flex:1 0 18px;background:var(--clay);border-radius:3px 3px 0 0;position:relative;min-height:2px}.cols div small{position:absolute;bottom:-16px;left:-4px;right:-4px;text-align:center;font-size:.55rem;color:var(--mute)}
details>summary{cursor:pointer;font-weight:600;color:var(--moss);padding:6px 0}
.dayhd{display:flex;justify-content:space-between;align-items:baseline;margin:14px 0 6px;font-weight:700;color:var(--moss-d)}
.item{display:flex;justify-content:space-between;gap:10px;padding:9px 0;border-bottom:1px solid var(--line2)}.item:last-child{border:0}
.item .v{font-weight:700;white-space:nowrap}
.sep{height:1px;background:var(--line);margin:12px 0}
.small{font-size:.78rem;color:var(--mute)}
</style>
</head>

<script>
/* ===== NÚCLEO: cálculos, formatação, CSV e PDF (sem dependências) ===== */
const Core=(()=>{
let REF=317; /* marco da placa no ponto de partida do ramal (km regressivo do PDF) */
function setRef(n){REF=n>0?Number(n):317;}
const R=(n)=>(Number(n)||0);
const round2=(n)=>Math.round((R(n)+Number.EPSILON)*100)/100;
const brl=(n)=>round2(n).toLocaleString('pt-BR',{style:'currency',currency:'BRL'});
const num=(n,d=1)=>R(n).toLocaleString('pt-BR',{minimumFractionDigits:0,maximumFractionDigits:d});
const pad=(n)=>String(n).padStart(2,'0');
const isoDate=(d)=>d.getFullYear()+'-'+pad(d.getMonth()+1)+'-'+pad(d.getDate());
const parseISO=(s)=>{if(!s)return null;const m=/^(\d{4})-(\d{2})-(\d{2})$/.exec(s);if(!m)return null;const d=new Date(+m[1],+m[2]-1,+m[3]);return isNaN(d)?null:d;};
const brDate=(s)=>{const d=typeof s==='string'?parseISO(s.slice(0,10)):s;if(!d)return'—';const dd=pad(d.getDate()),mm=pad(d.getMonth()+1),yy=d.getFullYear();const l=(typeof S!=='undefined'&&S.cfg&&S.cfg.idioma)||'pt';return l==='en'?mm+'/'+dd+'/'+yy:dd+'/'+mm+'/'+yy;};
const brDateTime=(iso)=>{const d=new Date(iso);return isNaN(d)?'—':brDate(d)+' '+pad(d.getHours())+':'+pad(d.getMinutes());};
const addDays=(d,n)=>{const x=new Date(d.getFullYear(),d.getMonth(),d.getDate());x.setDate(x.getDate()+n);return x;};
const diffDays=(a,b)=>Math.round((Date.UTC(b.getFullYear(),b.getMonth(),b.getDate())-Date.UTC(a.getFullYear(),a.getMonth(),a.getDate()))/864e5);
/* valores digitados em pt-BR ("1.234,56" ou "120,5" ou "120.50") */
const parseMoney=(s)=>{if(typeof s==='number')return isFinite(s)&&s>=0?round2(s):NaN;let t=String(s??'').replace(/[R$\s]/g,'');if(!t)return NaN;
  if(t.includes(',')){t=t.replace(/\./g,'').replace(',','.');}else if((t.match(/\./g)||[]).length>1){t=t.replace(/\./g,'');}
  const v=Number(t);return isFinite(v)&&v>=0?round2(v):NaN;};
const parseKm=(s)=>{if(typeof s==='number')return isFinite(s)&&s>=0?s:NaN;let t=String(s??'').trim().replace(/\s/g,'');if(!t)return NaN;
  t=t.includes(',')?t.replace(/\./g,'').replace(',','.'):t;const v=Number(t);return isFinite(v)&&v>=0?v:NaN;};
const uid=(p='x')=>p+Date.now().toString(36)+Math.random().toString(36).slice(2,8);

/* ---- posição e distâncias ---- */
function marcoDe(acc){return round2(REF-R(acc));}
function kmAtual(st){const h=st.kmHist||[];return h.length?R(h[h.length-1].km):R(st.cfg.kmInicial);}
function distRestante(kmHosp,kmAt){return kmHosp==null||kmHosp===''?null:round2(R(kmHosp)-R(kmAt));}
function situacao(d){if(d==null)return'sem-km';if(Math.abs(d)<0.05)return'no-ponto';return d>0?'a-frente':'para-tras';}
function diasCaminhada(dist,media){if(dist==null||!(media>0))return null;return dist>0?Math.ceil(dist/media-1e-9):0;}
function dataBase(st,hoje){const ini=parseISO(st.cfg.inicio);const percorrido=kmAtual(st)-R(st.cfg.kmInicial);
  if(!ini)return hoje;if(percorrido<=0||hoje<ini)return ini;return hoje;}
function dataChegada(st,dist,hoje){const n=diasCaminhada(dist,mediaEf(st.cfg));if(n==null)return null;return addDays(dataBase(st,hoje),n);}
/* ramal a que pertence a pousada depois de Campos do Jordão (km 241): null = vale para os dois ramais */
const KM_BIFURCA=241;
function ramalDoPonto(h){if(!h||h.km_inicio==null||h.km_inicio<=KM_BIFURCA)return null;const m=h.municipio||'';
  if(/Guaratingu|Gomeral|Potim|Pedrinhas/i.test(m))return 'G';
  if(/Pindamonhangaba|Piracuama|Pinhal|Ribeir[ãa]o Grande|Mandu/i.test(m))return 'P';return null;}
function passaRamal(st,h){const rf=st&&st.cfg?st.cfg.ramal:null;if(!rf||rf==='todos')return true;const rb=ramalDoPonto(h);return !rb||rb===rf;}
function proximas(st,hoje,f={}){const at=kmAtual(st);
  return (st.hosp||[]).filter(h=>h.ativo!==false).map(h=>{const d=distRestante(h.km_inicio,at);return{h,dist:d,sit:situacao(d),eta:d!=null&&d>=0?dataChegada(st,d,hoje):null,dias:d!=null&&d>=0?diasCaminhada(d,mediaEf(st.cfg)):null};})
  .filter(x=>x.dist!=null&&x.dist>=-0.05).filter(x=>{
    if(f.tipo&&f.tipo!=='todos'&&x.h.tipo!==f.tipo)return false;
    if(!passaRamal(st,x.h))return false;
    if(f.max&&x.dist>f.max)return false;
    if(f.municipio&&x.h.municipio!==f.municipio)return false;
    if(f.categoria&&x.h.categoria!==f.categoria)return false;
    if(f.precoMax&&!(x.h.preco_min!=null&&x.h.preco_min<=f.precoMax))return false;
    if(f.disp&&f.disp!=='todas'&&(x.h.disponibilidade||'desconhecida')!==f.disp)return false;
    if(!temComodidades(x.h,f.am))return false;
    if(f.cred&&!x.h.credencial)return false;
    if(f.q&&!norm(x.h.nome+' '+x.h.municipio).includes(norm(f.q)))return false;
    return true;}).sort((a,b)=>a.dist-b.dist||a.h.nome.localeCompare(b.h.nome));}
const norm=(s)=>String(s||'').normalize('NFD').replace(/[\u0300-\u036f]/g,'').toLowerCase();

/* ---- contatos ---- */
const digits=(s)=>String(s||'').replace(/\D/g,'');
function foneInfo(num){const d=digits(num);let n=d.startsWith('55')&&d.length>=12?d.slice(2):d;
  const ok=(n.length===10||n.length===11);const movel=n.length===11&&n[2]==='9';return{digits:n,valido:ok,movel};}
function waLink(num){const i=foneInfo(num);return i.valido&&i.movel?'https://wa.me/55'+i.digits:null;}
function mapsLink(h){const q=[h.nome,h.endereco,h.municipio].filter(Boolean).join(', ');return q?'https://www.google.com/maps/search/?api=1&query='+encodeURIComponent(q):null;}

/* ---- reservas e finanças ---- */
function diarias(ent,sai){const a=parseISO(ent),b=parseISO(sai);if(!a||!b)return NaN;const n=diffDays(a,b);return n>0?n:NaN;}
function totalReserva(r){const n=R(r.diarias);return round2(n*R(r.valorDiaria)+R(r.taxas));}
function pagoReserva(st,rid){return round2((st.pagamentos||[]).filter(p=>p.reservaId===rid).reduce((s,p)=>s+R(p.valor),0));}
/* pagamento em duas partes: 50% adiantado + 50% na data de entrada */
function planoMetade(r,pago){const t=totalReserva(r),m=round2(t/2),p=R(pago);return{metade:m,segunda:round2(t-m),adiantPendente:Math.max(0,round2(m-p)),segundaPendente:p<m?round2(t-m):Math.max(0,round2(t-p))};}
function pendenteReserva(st,r){return Math.max(0,round2(totalReserva(r)-pagoReserva(st,r.id)));}
function statusPag(st,r){const t=totalReserva(r),p=pagoReserva(st,r.id);if(p<=0)return'não pago';return p+0.004>=t?'pago':'parcialmente pago';}

const I18N={"nav.inicio": {"pt": "Início", "en": "Home", "es": "Inicio"}, "nav.hosp": {"pt": "Hospedagem", "en": "Lodging", "es": "Alojamiento"}, "nav.gastos": {"pt": "Gastos", "en": "Expenses", "es": "Gastos"}, "nav.relatorios": {"pt": "Relatório", "en": "Report", "es": "Informe"}, "nav.config": {"pt": "Ajustes", "en": "Settings", "es": "Ajustes"}, "seg.todas": {"pt": "Todas", "en": "All", "es": "Todas"}, "seg.agendadas": {"pt": "Agendadas", "en": "Booked", "es": "Reservadas"}, "seg.arquivadas": {"pt": "Arquivadas", "en": "Archived", "es": "Archivadas"}, "seg.alimentacao": {"pt": "Alimentação", "en": "Food", "es": "Alimentación"}, "seg.demais": {"pt": "Demais custos", "en": "Other costs", "es": "Otros gastos"}, "setup.bemvindo": {"pt": "Bem-vindo, peregrino!", "en": "Welcome, pilgrim!", "es": "¡Bienvenido, peregrino!"}, "setup.intro": {"pt": "Vamos configurar o essencial para planejar sua caminhada. Você pode mudar tudo depois em Ajustes.", "en": "We will set up the essentials to plan your walk. You can change everything later in Settings.", "es": "Configuremos lo esencial para planificar tu camino. Puedes cambiar todo después en Ajustes."}, "setup.idioma": {"pt": "Idioma", "en": "Language", "es": "Idioma"}, "setup.transp": {"pt": "Como será o caminho", "en": "How you will walk it", "es": "Cómo harás el camino"}, "setup.inicio": {"pt": "Data de início da caminhada (primeiro dia)", "en": "Start date (first day)", "es": "Fecha de inicio (primer día)"}, "setup.media": {"pt": "Quantos km pretende caminhar por dia?", "en": "How many km per day?", "es": "¿Cuántos km al día?"}, "setup.ramal": {"pt": "Ramal de finalização (a partir de Campos do Jordão)", "en": "Finishing branch (from Campos do Jordão)", "es": "Ramal de llegada (desde Campos do Jordão)"}, "setup.nota": {"pt": "Define quais pousadas e lanchonetes aparecem no trecho final. Pode mudar depois em Ajustes.", "en": "Sets which lodgings and food stops show on the final stretch. You can change it later in Settings.", "es": "Define qué alojamientos y restaurantes aparecen en el tramo final. Puedes cambiarlo en Ajustes."}, "setup.comecar": {"pt": "Começar", "en": "Start", "es": "Empezar"}, "ramal.ainda": {"pt": "Ainda não decidi", "en": "Not decided yet", "es": "Aún no lo decido"}, "transp.pe": {"pt": "A pé", "en": "On foot", "es": "A pie"}, "transp.bike": {"pt": "Bicicleta", "en": "Bicycle", "es": "Bicicleta"}, "transp.cavalo": {"pt": "Cavalo", "en": "Horse", "es": "Caballo"}, "transp.carro": {"pt": "Carro", "en": "Car", "es": "Coche"}, "transp.moto": {"pt": "Moto", "en": "Motorcycle", "es": "Moto"}, "tut.t1": {"pt": "1 de 5 · Sua posição", "en": "1 of 5 · Your position", "es": "1 de 5 · Tu posición"}, "tut.t2": {"pt": "2 de 5 · Hospedagens", "en": "2 of 5 · Lodgings", "es": "2 de 5 · Alojamientos"}, "tut.t3": {"pt": "3 de 5 · Gastos", "en": "3 of 5 · Expenses", "es": "3 de 5 · Gastos"}, "tut.t4": {"pt": "4 de 5 · Relatório e ajustes", "en": "4 of 5 · Report and settings", "es": "4 de 5 · Informe y ajustes"}, "tut.p1": {"pt": "Na tela Início há três formas de atualizar sua posição: digitar o marco da placa e tocar em 'Atualizar minha posição' (manual); tocar em 'Usar minha localização' no mapa (via GPS); ou fazer check-in numa pousada quando chegar.", "en": "On the Home screen there are three ways to update your position: type the milestone and tap 'Update my position' (manual); tap 'Use my location' on the map (via GPS); or check in at a lodging when you arrive.", "es": "En la pantalla Inicio hay tres formas de actualizar tu posición: escribir el marco y tocar 'Actualizar mi posición' (manual); tocar 'Usar mi ubicación' en el mapa (GPS); o hacer check-in en un alojamiento al llegar."}, "tut.x1": {"pt": "A posição pelo GPS pode variar um pouco, por isso é só uma estimativa. Sem GPS, o app não se atualiza sozinho.", "en": "GPS position can vary a little, so it is only an estimate. Without GPS, the app does not update on its own.", "es": "La posición por GPS puede variar un poco, así que es solo una estimación. Sin GPS, la app no se actualiza sola."}, "tut.p2": {"pt": "Na aba Hospedagem, 'Todas' mostra as pousadas. Em 'Agendadas' ficam as reservas, e em 'Arquivadas' as que já passaram.", "en": "In the Lodging tab, 'All' shows the lodgings. 'Booked' holds your reservations and 'Archived' holds past ones.", "es": "En la pestaña Alojamiento, 'Todas' muestra los alojamientos. 'Reservadas' guarda tus reservas y 'Archivadas' las pasadas."}, "tut.x2": {"pt": "Toque em uma pousada para ver os detalhes. Use a estrela para favoritar e o check-in para registrar que chegou.", "en": "Tap a lodging to see its details. Use the star to favorite and check-in to record your arrival.", "es": "Toca un alojamiento para ver sus detalles. Usa la estrella para marcar favoritos y el check-in para registrar tu llegada."}, "tut.p3": {"pt": "Na aba Gastos, use '+ Novo lançamento' para registrar comida (Alimentação) ou outras despesas (Demais custos).", "en": "In the Expenses tab, use '+ New entry' to record food (Food) or other costs (Other costs).", "es": "En la pestaña Gastos, usa '+ Nuevo registro' para anotar comida (Alimentación) u otros gastos (Otros gastos)."}, "tut.x3": {"pt": "Para pagar uma reserva, toque em '+ Pagamento' no cartão dela. Pagamentos ficam registrados e aparecem no relatório.", "en": "To pay a reservation, tap '+ Payment' on its card. Payments are recorded and appear in the report.", "es": "Para pagar una reserva, toca '+ Pago' en su tarjeta. Los pagos quedan registrados y aparecen en el informe."}, "tut.p4": {"pt": "Na aba Relatório, toque em 'Gerar relatório em PDF' para salvar o arquivo.", "en": "In the Report tab, tap 'Generate PDF report' to save the file.", "es": "En la pestaña Informe, toca 'Generar informe en PDF' para guardar el archivo."}, "tut.x4": {"pt": "Em Ajustes você muda data, média e aparência. Para começar de novo, use 'Apagar tudo' (faça um backup antes).", "en": "In Settings you change date, daily average and appearance. To start over, use 'Erase all' (back up first).", "es": "En Ajustes cambias fecha, media y apariencia. Para empezar de nuevo, usa 'Borrar todo' (haz una copia antes)."}, "btn.anterior": {"pt": "Anterior", "en": "Previous", "es": "Anterior"}, "btn.proximo": {"pt": "Próximo", "en": "Next", "es": "Siguiente"}, "btn.fechar": {"pt": "Fechar", "en": "Close", "es": "Cerrar"}, "btn.comecar": {"pt": "Começar", "en": "Start", "es": "Empezar"}, "tut.ver": {"pt": "Ver tutorial", "en": "Tutorial", "es": "Tutorial"}, "cj.titulo": {"pt": "Você está chegando a Campos do Jordão.", "en": "You are nearing Campos do Jordão.", "es": "Estás llegando a Campos do Jordão."}, "cj.texto": {"pt": "Para chegar ao Horto Florestal, procure opções de Uber ou ônibus e confira horários e trajetos antes de sair.", "en": "To reach the Horto Florestal, look for Uber or bus options and check schedules and routes before leaving.", "es": "Para llegar al Horto Florestal, busca Uber o autobús y revisa horarios y rutas antes de salir."}, "cj.mapa": {"pt": "Ver no Google Maps", "en": "See on Google Maps", "es": "Ver en Google Maps"}, "cj.escolha": {"pt": "Para finalizar o caminho, escolha o ramal de finalização:", "en": "To finish the walk, choose the finishing branch:", "es": "Para terminar el camino, elige el ramal de llegada:"}, "setraj.btn": {"pt": "Ajude-me com meu trajeto", "en": "Help me with my route", "es": "Ayúdame con mi recorrido"}, "setraj.alerta": {"pt": "Atenção: as pousadas indicadas precisam ter a disponibilidade confirmada por você antes da viagem. O app não verifica vagas. Ao incluí-las, elas ficam com status “Planejada” até você confirmar.", "en": "Attention: you must confirm availability with the suggested lodgings before the trip. The app does not check vacancies. Once added, they stay “Planned” until you confirm.", "es": "Atención: debes confirmar la disponibilidad de los alojamientos sugeridos antes del viaje. La app no verifica plazas. Al incluirlos, quedan como “Planificada” hasta que const TRAJ={modo:'data',fim:'',km:'',inicio:'',res:null,erro:''};
function gerarTrajeto(){TRAJ.erro='';TRAJ.res=null;const acc0=pos(),REFt=Core.REF,resta=REFt-acc0;
  if(resta<=0){TRAJ.erro='Você já chegou ao fim do ramal.';return;}
  const hojeD=(TRAJ.inicio&&parseISO(TRAJ.inicio))?parseISO(TRAJ.inicio):hoje();let dias,med;
  if(TRAJ.modo==='data'){const fim=parseISO(TRAJ.fim);if(!fim){TRAJ.erro='Informe a data final.';return;}dias=diffDays(hojeD,fim)+1;if(dias<1){TRAJ.erro='A data final precisa ser depois de hoje.';return;}med=resta/dias;}
  else{const k=parseKm(TRAJ.km);if(isNaN(k)||k<=0){TRAJ.erro='Informe quantos km pretende andar por dia.';return;}med=k;dias=Math.ceil(resta/med-1e-9);}

  for(let i=1;i<=dias;i++){const alvo=Math.min(REFt,acc0+med*i);const tol=Math.max(5,med/2);
    let best=null;hs.forEach(h=>{const dd=Math.abs(h.km_inicio-alvo);if(dd<=tol&&(!best||dd<best.dd))best={h,dd};});

const BASE_URL=new URL('base-ramal-principal.json',location.href).href;

const BASE_IDS=new Set(BASE.map(x=>x.id));
const numEd=(x)=>{const v=parseFloat(String(x||'').replace(',','.'));return isNaN(v)?-1:v;};
const dataEd=(x)=>{const m=/^(\d\d)\/(\d\d)\/(\d{4})$/.exec(x||'');return m?+(m[3]+m[2]+m[1]):0;};
function plusNovo(local,site){if(numEd(site.edicao)!==numEd(local.edicao))return numEd(site.edicao)>numEd(local.edicao);return dataEd(site.atualizado)>dataEd(local.atualizado);}
function mesclarPorId(hosp,novos){const idx=new Map(hosp.map(h=>[h.id,h]));const idsNovos=new Set(novos.map(n=>n.id));let add=0,upd=0,rem=0;const addIds=[];
  for(const n of novos){const e=idx.get(n.id);
    if(!e){hosp.push({...n,disponibilidade:'desconhecida',notas:''});add++;addIds.push(n.id);continue;}
    if(e.editado){/* registro corrigido à mão: mantém suas correções, só atualiza o que não foi editado */const keep={};Object.keys(n).forEach(k=>{if(!(k in e))keep[k]=n[k];});Object.assign(e,keep);continue;}
    const d=e.disponibilidade,nt=e.notas;Object.assign(e,n,{disponibilidade:d,notas:nt});upd++;}
  for(let i=hosp.length-1;i>=0;i--){const h=hosp[i];if(!idsNovos.has(h.id)&&String(h.origem||'').startsWith('pdf')&&!h.editado){hosp.splice(i,1);rem++;}}
  return{add,upd,rem,addIds};}

  try{const r=await fetch(FONTE_URL,{cache:'no-store'});if(!r.ok)throw new Error('site '+r.status);fonte=await r.json();}
  catch(e){if(manual)toast(t('msg.20'),1);return;}
  const local=S.baseInfo||{edicao:'',atualizado:''};
  if(!fonte||!fonte.edicao){if(manual)toast(t('msg.36'),1);return;}
  if(!plusNovo(local,{edicao:fonte.edicao,atualizado:fonte.atualizado||''})){if(manual)toast(t('msg.sua_lista').replace('{0}',String(local.edicao)));return;}

  catch(e){if(manual)toast(t('msg.19'),1);return;}
  if(!nova||!Array.isArray(nova.hosp)||nova.hosp.length<200){if(manual)toast(t('msg.01'),1);return;}
  const m=mesclarPorId(S.hosp,nova.hosp);S.novosEdicao=m.addIds;
  S.baseInfo={edicao:nova.meta.edicao,atualizado:nova.meta.atualizado,importadoEm:new Date().toISOString(),fonte:'site'};save();render();
  toast(t('msg.lista_atualizada').replace('{0}',String(nova.meta.edicao)).replace('{1}',String(m.add)).replace('{2}',String(m.upd)).replace('{3}',String(m.rem)));}
